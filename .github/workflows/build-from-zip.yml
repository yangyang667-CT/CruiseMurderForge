name: Build CruiseMurderForge from source archive
on:
  push:
    paths:
      - 'CruiseMurderForge-0.11.0-source.zip'
      - '.github/workflows/build-from-zip.yml'
      - '.github/scripts/patch-sources.py'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract source archive
        run: |
          test -f CruiseMurderForge-0.11.0-source.zip
          mkdir -p extracted
          unzip -q CruiseMurderForge-0.11.0-source.zip -d extracted
          test -f extracted/CruiseMurderForge/build.gradle
      - name: Apply 1.20.1 Forge source fixes
        run: python3 .github/scripts/patch-sources.py extracted/CruiseMurderForge
      - name: Build mod
        working-directory: extracted/CruiseMurderForge
        run: gradle --no-daemon build --stacktrace
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CruiseMurderForge-0.11.0
          path: extracted/CruiseMurderForge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CruiseMurderForge-build-diagnostics
          path: |
            extracted/CruiseMurderForge/build/reports/**
            extracted/CruiseMurderForge/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
